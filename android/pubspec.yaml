name: souren
description: «سورن» — دیکشنری عربی به فارسی و کیبورد فارسیِ درست‌نویس (اندروید)
publish_to: 'none'
version: 0.4.6.1+13 # Souren v0.4.6.1 — restore original navigation geometry and fix indicator bounds

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  material_symbols_icons: 4.2960.0
  path_drawing: ^1.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true # Material filled glyphs are used for selected navigation states
  assets:
    - assets/db/dataset.json
    - assets/db/categories.json
    - assets/db/proverbs.json
    - assets/branding/souren-logo.svg
  fonts:
    - family: Arad
      fonts:
        - asset: assets/fonts/arad/Arad-Regular.ttf
          weight: 400
        - asset: assets/fonts/arad/Arad-Medium.ttf
          weight: 500
        - asset: assets/fonts/arad/Arad-Bold.ttf
          weight: 700
    # Lucide soft icon pack (ISC) — vendored from CUI
    # (yappologistic/CUI, assets/fonts/Lucide-CUI.ttf): a single
    # stroke weight, so the selected state is conveyed by color.
    - family: Lucide
      fonts:
        - asset: assets/fonts/lucide/Lucide-CUI.ttf
          weight: 400
