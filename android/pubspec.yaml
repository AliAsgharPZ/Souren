name: souren
description: «سورن» — دیکشنری عربی به فارسی و کیبورد فارسیِ درست‌نویس (اندروید)
publish_to: 'none'
version: 0.4.1+7

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: false # no Material icons: Phosphor only
  assets:
    - assets/db/dataset.json
    - assets/db/categories.json
  fonts:
    - family: Arad
      fonts:
        - asset: assets/fonts/arad/Arad-Regular.ttf
          weight: 400
        - asset: assets/fonts/arad/Arad-Medium.ttf
          weight: 500
        - asset: assets/fonts/arad/Arad-Bold.ttf
          weight: 700
    # Phosphor soft icon pack (MIT) — vendored: phosphor_flutter 2.1.0
    # cannot compile on current stable (extends now-final IconData).
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Regular.ttf
          weight: 400
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Fill.ttf
          weight: 400
