name: souren
description: «سورن» — دیکشنری عربی به فارسی و کیبورد فارسیِ درست‌نویس (اندروید)
publish_to: 'none'
version: 0.4.7+26 # Souren v0.4.7.2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  material_symbols_icons: 4.2960.0
  material_ui: ^1.0.0
  path_drawing: ^1.0.1
  zstandard: ^1.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true # Material filled glyphs are used for selected navigation states
  assets:
    - assets/db/dataset.json
    - assets/db/categories.json
    - assets/db/proverbs.json
    - assets/branding/souren-logo.svg
    - assets/branding/ario-logo.svg
  fonts:
    - family: Abar
      fonts:
        - asset: assets/fonts/abar/AbarMidFaNum-Regular.ttf
          weight: 400
        - asset: assets/fonts/abar/AbarMidFaNum-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/abar/AbarMidFaNum-Bold.ttf
          weight: 700
        - asset: assets/fonts/abar/AbarMidFaNum-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/abar/AbarMidFaNum-Black.ttf
          weight: 900
    # Lucide soft icon pack (ISC) — vendored from CUI
    # (yappologistic/CUI, assets/fonts/Lucide-CUI.ttf): a single
    # stroke weight, so the selected state is conveyed by color.
    - family: Lucide
      fonts:
        - asset: assets/fonts/lucide/Lucide-CUI.ttf
          weight: 400
