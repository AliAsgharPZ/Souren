name: souren
description: «سورن» — دیکشنری عربی به فارسی و کیبورد فارسیِ درست‌نویس (اندروید)
publish_to: 'none'
version: 0.4.1+7

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: false # no Material icons: Lucide only
  assets:
    - assets/db/dataset.json
    - assets/db/categories.json
  fonts:
    - family: Arad
      fonts:
        - asset: assets/fonts/arad/Arad-Regular.ttf
          weight: 400
        - asset: assets/fonts/arad/Arad-Medium.ttf
          weight: 500
        - asset: assets/fonts/arad/Arad-Bold.ttf
          weight: 700
    # Lucide soft icon pack (ISC) — the exact subset embedded on the
    # CUI site (https://yappologistic.github.io/CUI/), vendored with its
    # license file. Code points live in lib/lucide.dart.
    - family: Lucide
      fonts:
        - asset: assets/fonts/lucide/Lucide-CUI.ttf
          weight: 400
