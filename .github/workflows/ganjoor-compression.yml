name: Ganjoor compression experiments (parallel)

on:
  workflow_dispatch:
  push:
    branches:
      - compression/ganjoor-under-50mb
    paths:
      - .github/workflows/ganjoor-compression.yml

permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - id: zstd-15
            label: Zstandard level 15
            package: zstd
            command: zstd -15 -T2 -c
            extension: zst
          - id: zstd-19
            label: Zstandard level 19
            package: zstd
            command: zstd --ultra -19 -T2 -c
            extension: zst
          - id: zstd-22
            label: Zstandard level 22 long mode
            package: zstd
            command: zstd --ultra -22 --long=27 -T2 -c
            extension: zst
          - id: xz-64
            label: XZ extreme dictionary 64 MiB
            package: xz-utils
            command: xz -9e --threads=2 --lzma2=dict=64MiB -c
            extension: xz
          - id: xz-128
            label: XZ extreme dictionary 128 MiB
            package: xz-utils
            command: xz -9e --threads=2 --lzma2=dict=128MiB -c
            extension: xz
          - id: xz-256
            label: XZ extreme dictionary 256 MiB
            package: xz-utils
            command: xz -9e --threads=2 --lzma2=dict=256MiB -c
            extension: xz
          - id: brotli-11
            label: Brotli quality 11
            package: brotli
            command: brotli -q 11 -w 24 -c
            extension: br
          - id: lz4-12
            label: LZ4 high compression
            package: lz4
            command: lz4 -12 -q -c
            extension: lz4
          - id: gzip-9
            label: Gzip level 9
            package: gzip
            command: gzip -9 -c
            extension: gz
          - id: 7z-lzma2
            label: 7-Zip solid LZMA2
            package: p7zip-full
            command: ''
            extension: 7z

    steps:
      - name: Install selected compressor
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.package }}

      - name: Download and prepare official Ganjoor source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors \
            https://codeload.github.com/ganjoor/ganjoor-data/tar.gz/refs/heads/main \
            -o /tmp/ganjoor-source.tar.gz
          mkdir -p /tmp/source
          tar -xzf /tmp/ganjoor-source.tar.gz --strip-components=1 -C /tmp/source
          test -s /tmp/source/manifest.json
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/source/manifest.json',encoding='utf-8'))
          print('GeneratedAtUtc:',m.get('GeneratedAtUtc'))
          print('PoetsCount:',m.get('PoetsCount'))
          print('PoemsCount:',m.get('PoemsCount'))
          PY
          du -sh /tmp/source
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner \
            -C /tmp/source -cf /tmp/ganjoor-data.tar .
          sha256sum /tmp/ganjoor-data.tar | tee /tmp/source.sha256
          mkdir -p out

      - name: Compress selected variant
        shell: bash
        run: |
          set -euo pipefail
          INPUT=/tmp/ganjoor-data.tar
          OUTPUT="out/ganjoor-data.${{ matrix.extension }}"
          if [ "${{ matrix.id }}" = "7z-lzma2" ]; then
            7z a -t7z -m0=lzma2:d=256m -mx=9 -ms=on "$OUTPUT" "$INPUT"
          else
            ${{ matrix.command }} "$INPUT" > "$OUTPUT"
          fi
          stat --printf='Compressed bytes: %s\n' "$OUTPUT"
          sha256sum "$OUTPUT" > out/compressed.sha256

      - name: Verify exact lossless round trip
        shell: bash
        run: |
          set -euo pipefail
          INPUT=/tmp/ganjoor-data.tar
          OUTPUT="out/ganjoor-data.${{ matrix.extension }}"
          case "${{ matrix.id }}" in
            zstd-*) zstd -dc "$OUTPUT" > /tmp/roundtrip.tar ;;
            xz-*) xz -dc "$OUTPUT" > /tmp/roundtrip.tar ;;
            brotli-11) brotli -d -c "$OUTPUT" > /tmp/roundtrip.tar ;;
            lz4-12) lz4 -d -c "$OUTPUT" > /tmp/roundtrip.tar ;;
            gzip-9) gzip -dc "$OUTPUT" > /tmp/roundtrip.tar ;;
            7z-lzma2) 7z x -y "-o/tmp/roundtrip" "$OUTPUT" >/dev/null; cp /tmp/roundtrip/ganjoor-data.tar /tmp/roundtrip.tar ;;
          esac
          ORIGINAL=$(sha256sum "$INPUT" | cut -d' ' -f1)
          ACTUAL=$(sha256sum /tmp/roundtrip.tar | cut -d' ' -f1)
          test "$ORIGINAL" = "$ACTUAL"
          echo "PASS: byte-for-byte identical after decompression"
          python3 - <<'PY'
          import os
          n=os.path.getsize("out/ganjoor-data.${{ matrix.extension }}")
          print(f"RESULT_MB={n/1_000_000:.3f}")
          print(f"RESULT_BYTES={n}")
          PY

      - name: Write result
        if: always()
        shell: bash
        run: |
          mkdir -p out
          {
            echo "# Compression result: ${{ matrix.label }}"
            echo
            echo "- Variant: ${{ matrix.id }}"
            echo "- Source: https://github.com/ganjoor/ganjoor-data"
            if [ -f "out/ganjoor-data.${{ matrix.extension }}" ]; then
              B=$(stat -c%s "out/ganjoor-data.${{ matrix.extension }}")
              echo "- Compressed size: $B bytes"
            else
              echo "- Result: compression output missing (see job log)"
            fi
            if [ -f /tmp/source.sha256 ]; then
              echo "- Source tar SHA-256: $(cut -d' ' -f1 /tmp/source.sha256)"
            fi
            if [ -f /tmp/roundtrip.tar ]; then
              echo "- Lossless verification: PASS"
            else
              echo "- Lossless verification: NOT PASSED"
            fi
          } > out/RESULT.md
          cat out/RESULT.md

      - name: Upload this experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ganjoor-compression-${{ matrix.id }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
