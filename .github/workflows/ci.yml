name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Dataset integrity (anchors)
        run: python3 tools/build_dataset.py | head -1
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Dart tests (corrector engine + widgets)
        run: flutter test
      - name: Kotlin unit tests (IME corrector)
        working-directory: android/android
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build release APK (debug-signed for v0.1)
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: souren-release-apk
          path: android/build/app/outputs/flutter-apk/app-release.apk
