name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Dataset integrity (anchors)
        run: python3 tools/build_dataset.py | head -1
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Dart tests (corrector engine + widgets)
        run: flutter test
      - name: Release signing key (from secrets, if present)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            CLEAN=$(printf '%s' "$KS_B64" | tr -d '[:space:]')
            if printf '%s' "$CLEAN" | base64 -d > souren-release.keystore 2>/dev/null && [ -s souren-release.keystore ]; then
              printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=souren-release.keystore\n' "$KS_PW" "$KEY_PW" "$KEY_ALIAS" > key.properties
              echo "release key ready"
            else
              echo "keystore decode failed; debug signing fallback"
              rm -f souren-release.keystore
            fi
          else
            echo "no keystore secret; debug signing fallback"
          fi
      - name: Build release APK
        run: flutter build apk --release
      - name: Kotlin unit tests (IME corrector)
        working-directory: android/android
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: souren-release-apk
          path: android/build/app/outputs/flutter-apk/app-release.apk
