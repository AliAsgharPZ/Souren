name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [maintenance/v0.4.1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Dataset integrity (anchors)
        # The output goes to a log file first so the pipeline exit
        # status is python's, not `head`'s (the old `| head -1` could
        # hide a failed assertion — owner B7). A failed dataset
        # assertion must fail the workflow.
        run: |
          python3 tools/build_dataset.py > dataset_build.log
          head -1 dataset_build.log
      - name: Dataset guard (invalid anchors must fail the build)
        run: bash tools/test_anchor_guard.sh
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Dart tests (corrector engine + widgets)
        run: flutter test
      - name: Release signing key (from secrets, if present)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            CLEAN=$(printf '%s' "$KS_B64" | tr -d '[:space:]')
            if printf '%s' "$CLEAN" | base64 -d > android/souren-release.keystore 2>/dev/null && [ -s android/souren-release.keystore ]; then
              printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=souren-release.keystore\n' "$KS_PW" "$KEY_PW" "$KEY_ALIAS" > android/key.properties
              echo "release key ready"
            else
              echo "keystore decode failed; debug signing fallback"
              rm -f android/souren-release.keystore
            fi
          else
            echo "no keystore secret; debug signing fallback"
          fi
      - name: Build release APK
        run: |
          set -euo pipefail
          flutter build apk --release
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" > /tmp/souren-apksigner.txt
          head -3 /tmp/souren-apksigner.txt
      - name: Kotlin unit tests (IME corrector)
        working-directory: android/android
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: souren-release-apk
          path: android/build/app/outputs/flutter-apk/app-release.apk
