name: CI
on:
  push:
    branches: [main, fix/v0.4.5.5-ui-keyboard]
    tags: ['v*']
  pull_request:
    branches: [maintenance/v0.4.1, release/v0.4.5]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Dataset integrity (anchors)
        shell: bash
        run: set -o pipefail && python3 tools/build_dataset.py | sed -n '1p'
      - name: Pub get
        run: flutter pub get
      - name: Verify Souren package version
        run: |
          grep -F 'version: 0.4.5+11' pubspec.yaml
          grep -F 'versionName = "0.4.5.5"' android/app/build.gradle.kts
      - name: Analyze
        run: flutter analyze
      - name: Dart tests (corrector engine + widgets)
        run: flutter test
      - name: Release signing key (from secrets, if present)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            CLEAN=$(printf '%s' "$KS_B64" | tr -d '[:space:]')
            if printf '%s' "$CLEAN" | base64 -d > android/souren-release.keystore 2>/dev/null && [ -s android/souren-release.keystore ]; then
              printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=souren-release.keystore\n' "$KS_PW" "$KEY_PW" "$KEY_ALIAS" > android/key.properties
              echo "release key ready"
            else
              echo "keystore decode failed; debug signing fallback"
              rm -f android/souren-release.keystore
            fi
          else
            echo "no keystore secret; debug signing fallback"
          fi
      - name: Build release APK
        run: |
          set -euo pipefail
          flutter build apk --release
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" > /tmp/souren-apksigner.txt
          sed -n '1,3p' /tmp/souren-apksigner.txt
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | grep -F "versionCode='11' versionName='0.4.5.5'"
      - name: Kotlin unit tests (IME corrector)
        working-directory: android/android
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: souren-release-apk
          path: android/build/app/outputs/flutter-apk/app-release.apk
