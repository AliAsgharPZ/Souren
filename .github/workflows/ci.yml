name: CI

concurrency:
  group: souren-otp-gmail-release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Validate website and Worker JavaScript syntax
        run: |
          node --check ../worker.js
          node --check ../script.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Dataset integrity (anchors)
        shell: bash
        run: set -o pipefail && python3 tools/build_dataset.py | sed -n '1p'
      - name: Install Zstandard CLI for Ganjoor pack tests
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
      - name: Ganjoor seekable pack builder tests
        run: python3 -m unittest discover -s tools -p 'test_ganjoor_seekable_pack.py'
      - name: Pub get
        run: flutter pub get
      - name: Verify Souren package version
        run: |
          grep -F 'version: 0.4.7+28' pubspec.yaml
      - name: Analyze
        run: flutter analyze
      - name: Dart tests (corrector engine + widgets)
        run: flutter test
      - name: Release signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ] && { [ "$GITHUB_REF" = "refs/heads/main" ] || [ "$GITHUB_REF" = "refs/tags/v0.4.7.5" ]; }; then
            test -n "$KS_B64" && test -n "$KS_PW" && test -n "$KEY_PW" && test -n "$KEY_ALIAS"
          fi
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ] && [ -n "$KEY_PW" ] && [ -n "$KEY_ALIAS" ]; then
            CLEAN=$(printf '%s' "$KS_B64" | tr -d '[:space:]')
            printf '%s' "$CLEAN" | base64 -d > android/souren-release.keystore
            test -s android/souren-release.keystore
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=souren-release.keystore\n' "$KS_PW" "$KEY_PW" "$KEY_ALIAS" > android/key.properties
          fi
      - name: Render the exact supplied Souren app icon SVG
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pil librsvg2-bin
          SOURCE="assets/branding/souren-app-icon.svg"
          TARGET="android/app/src/main/res/mipmap-nodpi/ic_launcher.png"
          test -s "$SOURCE"
          rsvg-convert --width 1024 --height 1024 "$SOURCE" > /tmp/souren-app-icon.png
          python3 - <<'PY'
          from PIL import Image
          source = "/tmp/souren-app-icon.png"
          target = "android/app/src/main/res/mipmap-nodpi/ic_launcher.png"
          with Image.open(source) as image:
              image.load()
              assert image.size == (1024, 1024), image.size
              image.convert("RGBA").save(target, format="PNG", optimize=False)
          with Image.open(target) as check:
              check.verify()
              assert check.size == (1024, 1024)
          PY
      - name: Build release APK
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --build-name=0.4.7.5 --build-number=28
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" > /tmp/souren-apksigner.txt
          grep -q "Signer" /tmp/souren-apksigner.txt
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | grep -F "package: name='ir.souren.souren' versionCode='28' versionName='0.4.7.5'"
          for ABI in armeabi-v7a arm64-v8a x86_64; do unzip -l "$APK" | grep -q "lib/$ABI/"; done
          cp "$APK" Souren-v0.4.7.5.apk
      - name: Kotlin unit tests (IME corrector)
        working-directory: android/android
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Verify live Worker OTP and password-reset routes
        run: |
          set -euo pipefail
          BASE=https://souren.aliasgharpanahizare.workers.dev
          probe() {
            local path="$1" payload="$2" label="$3" output="/tmp/souren-${3}-probe.json"
            local status
            status=$(curl --silent --show-error --max-redirs 0 -o "$output" -w '%{http_code}' \
              -X POST "$BASE$path" -H 'Content-Type: application/json' --data "$payload")
            echo "$label route returned HTTP $status"
            node - "$output" "$status" "$label" <<'NODE'
          const fs = require('node:fs');
          const [file, statusText, label] = process.argv.slice(2);
          const status = Number(statusText);
          const raw = fs.readFileSync(file, 'utf8');
          let body;
          try { body = JSON.parse(raw); }
          catch {
            console.error(label + ' route did not return JSON:', raw.slice(0, 500));
            process.exit(1);
          }
          if (status < 400 || status >= 500 || !body || typeof body !== 'object' || typeof body.error !== 'string') {
            console.error(label + ' route returned an unexpected response:', status, body);
            process.exit(1);
          }
          NODE
          }
          HEALTH_STATUS=$(curl --silent --show-error --max-redirs 0 -o /tmp/souren-health.json -w '%{http_code}' "$BASE/api/health")
          test "$HEALTH_STATUS" = "200"
          node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync('/tmp/souren-health.json','utf8'));if(x.service!=='souren-worker'||x.status!=='ok')process.exit(1)"
          probe /api/auth/request-otp '{"email":"invalid-email","purpose":"register"}' otp
          probe /api/auth/reset-password '{}' reset
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Souren-v0.4.7.5-Universal-APK
          path: android/Souren-v0.4.7.5.apk
      - name: Publish Souren v0.4.7.5
        if: github.event_name == 'push' && github.ref == 'refs/tags/v0.4.7.5'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Souren v0.4.7.5. Smoother and longer page-header transitions; shorter bottom scroll fade; full-strength home scroll fade; swipe navigation inside liked and bookmarked collections; expanded account badges including Souren member; branded Souren OTP email; password-based login with email OTP registration and password recovery; updated Ario logo and launcher artwork; Persian-only Ario navigation with learner profile and settings; padded learned-word review list. Flutter analyze, Flutter tests, Kotlin tests, signed universal APK build, and ABI verification are required before publication."
          if gh release view v0.4.7.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.4.7.5 Souren-v0.4.7.5.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit v0.4.7.5 --repo "$GITHUB_REPOSITORY" --title "Souren v0.4.7.5" --notes "$NOTES"
          else
            gh release create v0.4.7.5 Souren-v0.4.7.5.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Souren v0.4.7.5" --notes "$NOTES"
          fi
