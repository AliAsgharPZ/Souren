name: CI

concurrency:
  group: souren-main-ci-release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Validate Cloudflare Worker syntax
        run: node --check ../worker.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Dataset integrity (anchors)
        shell: bash
        run: set -o pipefail && python3 tools/build_dataset.py | sed -n '1p'
      - name: Install Zstandard CLI for Ganjoor pack tests
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
      - name: Ganjoor seekable pack builder tests
        run: python3 -m unittest discover -s tools -p 'test_ganjoor_seekable_pack.py'
      - name: Pub get
        run: flutter pub get
      - name: Verify Souren package version
        run: |
          grep -F 'version: 0.4.7+27' pubspec.yaml
      - name: Analyze
        run: flutter analyze
      - name: Dart tests (corrector engine + widgets)
        run: flutter test
      - name: Release signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            test -n "$KS_B64" && test -n "$KS_PW" && test -n "$KEY_PW" && test -n "$KEY_ALIAS"
          fi
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ] && [ -n "$KEY_PW" ] && [ -n "$KEY_ALIAS" ]; then
            CLEAN=$(printf '%s' "$KS_B64" | tr -d '[:space:]')
            printf '%s' "$CLEAN" | base64 -d > android/souren-release.keystore
            test -s android/souren-release.keystore
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=souren-release.keystore\n' "$KS_PW" "$KEY_PW" "$KEY_ALIAS" > android/key.properties
          fi
      - name: Render the exact supplied Souren app icon SVG
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pil librsvg2-bin
          SOURCE="assets/branding/souren-app-icon.svg"
          TARGET="android/app/src/main/res/mipmap-nodpi/ic_launcher.png"
          test -s "$SOURCE"
          rsvg-convert --width 1024 --height 1024 "$SOURCE" > /tmp/souren-app-icon.png
          python3 - <<'PY'
          from PIL import Image
          source = "/tmp/souren-app-icon.png"
          target = "android/app/src/main/res/mipmap-nodpi/ic_launcher.png"
          with Image.open(source) as image:
              image.load()
              assert image.size == (1024, 1024), image.size
              image.convert("RGBA").save(target, format="PNG", optimize=False)
          with Image.open(target) as check:
              check.verify()
              assert check.size == (1024, 1024)
          PY
      - name: Build release APK
        run: |
          set -euo pipefail
          flutter build apk --release --build-name=0.4.7.4 --build-number=27
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" > /tmp/souren-apksigner.txt
          grep -q "Signer" /tmp/souren-apksigner.txt
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | grep -F "package: name='ir.souren.souren' versionCode='27' versionName='0.4.7.4'"
          cp "$APK" Souren-v0.4.7.4.apk
      - name: Kotlin unit tests (IME corrector)
        working-directory: android/android
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Souren-v0.4.7.4-APK
          path: android/Souren-v0.4.7.4.apk
      - name: Publish or refresh Souren v0.4.7.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            NOTES="Ario learning home redesigned as a winding, Duolingo-style lesson path with stateful lesson nodes and dedicated iconography; supplied Souren and Ario launcher artwork applied; randomized weekly dictionary refresh prevents unnecessary Worker requests; bottom content fade now extends behind the navigation bar; shared Cloudflare account session added to Android and Ario; website registration and email OTP login/profile verification added through the Worker (Gmail API provider). Canonical 552-entry dataset, Ganjoor offline pack, Abar font and restored v0.4.6.9 switch geometry retained. Signed APK package ir.souren.souren version 0.4.7.4 (27)."
            if gh release view v0.4.7.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload v0.4.7.4 Souren-v0.4.7.4.apk --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit v0.4.7.4 --repo "$GITHUB_REPOSITORY" --title "Souren v0.4.7.4" --notes "$NOTES"
            else
              gh release create v0.4.7.4 Souren-v0.4.7.4.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Souren v0.4.7.4" --notes "$NOTES"
            fi
          fi
