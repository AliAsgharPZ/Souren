name: Build maximum-compression Ganjoor corpus

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Souren
        uses: actions/checkout@v4
      - name: Checkout complete official Ganjoor export
        uses: actions/checkout@v4
        with:
          repository: ganjoor/ganjoor-data
          ref: main
          path: upstream/ganjoor-data
          fetch-depth: 1
      - name: Install compression codecs
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd brotli xz-utils
      - name: Build lossless SQLite and benchmark codecs
        run: |
          python3 android/tools/build_ganjoor_bundle.py \
            --source upstream/ganjoor-data \
            --out dist/ganjoor
      - name: Upload verified corpus and report
        uses: actions/upload-artifact@v4
        with:
          name: souren-ganjoor-maximum-compression
          path: |
            dist/ganjoor/ganjoor-full.sqlite.*
            dist/ganjoor/compression-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
